<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Today I Die" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Today I Die</title>
  </head>
  <body>
    <main id="app" aria-label="Today I Die game">
      <div id="game-shell">
        <div id="game" aria-label="Today I Die"></div>
      </div>

      <section id="language-dialog" role="dialog" aria-modal="true" aria-label="Language">
        <div class="language-card">
          <p class="language-kicker">Today I Die</p>
          <div class="language-grid" aria-label="Languages">
            <button type="button" data-lang="en" lang="en">English</button>
            <button type="button" data-lang="sp" lang="es">Español</button>
            <button type="button" data-lang="pt" lang="pt">Português</button>
            <button type="button" data-lang="de" lang="de">Deutsch</button>
            <button type="button" data-lang="it" lang="it">Italiano</button>
            <button type="button" data-lang="cz" lang="cs">Čeština</button>
            <button type="button" data-lang="fr" lang="fr">Français</button>
          </div>
        </div>
      </section>

      <button id="start" type="button" aria-label="Start Today I Die">
        <span>touch to begin</span>
      </button>

      <button id="fullscreen" type="button" aria-label="Enter fullscreen" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M8 3H3v5h2V5h3V3Zm8 0v2h3v3h2V3h-5ZM5 16H3v5h5v-2H5v-3Zm16 0h-2v3h-3v2h5v-5Z" />
        </svg>
      </button>

      <div id="install-hint" role="status" hidden>
        For the original iPhone feel, choose <strong>Add to Home Screen</strong> in your browser’s Share menu.
        <button type="button" aria-label="Dismiss install hint">×</button>
      </div>

      <p id="error" role="alert" hidden></p>
    </main>

    <noscript>This game needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
